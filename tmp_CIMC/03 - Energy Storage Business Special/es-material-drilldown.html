<html lang="zh-CN">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

<style>
:root{
--i:#6366f1;--i2:#818cf8;--em:#10b981;--am:#f59e0b;--ro:#ef4444;
--bk:#0f172a;--s0:#020617;--s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;
--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s600:#475569;--s700:#334155;
--s800:#1e293b;--s900:#0f172a;
--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.18);
--radius:14px;--shadow:0 4px 24px rgba(0,0,0,.06);
--topH:52px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Noto Sans SC',system-ui,sans-serif;background:linear-gradient(135deg,#f0f4ff 0%,#e8ecf9 40%,#f5f0ff 100%);min-height:100vh;color:var(--s800)}
.topbar{position:sticky;top:0;z-index:100;height:var(--topH);display:flex;align-items:center;justify-content:space-between;padding:0 24px;
background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--s200)}
.brand{font-weight:700;font-size:15px;color:var(--i);display:flex;align-items:center;gap:6px}
.brand svg{width:22px;height:22px}
.nav-links{display:flex;gap:4px}
.nav-links a{font-size:12.5px;padding:5px 13px;border-radius:8px;text-decoration:none;color:var(--s600);font-weight:500;transition:.2s}
.nav-links a:hover{background:var(--s100);color:var(--i)}
.nav-links a.active{background:var(--i);color:#fff}
.topbar-right{display:flex;align-items:center;gap:14px}
.btn-export{font-size:12px;padding:5px 14px;border-radius:8px;border:1px solid var(--s200);background:#fff;cursor:pointer;font-weight:500;color:var(--s600);transition:.15s}
.btn-export:hover{border-color:var(--i);color:var(--i)}
.filter-bar{display:flex;align-items:center;gap:10px;padding:10px 24px;flex-wrap:wrap}
.filter-bar label{font-size:12px;color:var(--s500);font-weight:500}
.filter-bar select{font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--s200);background:#fff;color:var(--s700);font-family:inherit;outline:none;cursor:pointer}
.filter-bar select:focus{border-color:var(--i)}
.filter-sep{width:1px;height:22px;background:var(--s200);margin:0 4px}
.main{padding:4px 24px 32px}
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi-card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.kpi-card .kl{font-size:11.5px;color:var(--s500);font-weight:500}
.kpi-card .kv{font-size:22px;font-weight:700;color:var(--s900)}
.kpi-card .kt{font-size:11px;font-weight:500;display:flex;align-items:center;gap:3px}
.kt.up{color:var(--ro)}.kt.down{color:var(--em)}
.card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-head{padding:16px 20px 0}
.card-title{font-size:14.5px;font-weight:700;color:var(--s800)}
.tab-nav{display:flex;gap:4px;padding:12px 20px 0}
.tab-btn{font-size:12.5px;padding:6px 16px;border-radius:8px 8px 0 0;border:none;background:transparent;color:var(--s500);font-weight:500;cursor:pointer;transition:.15s;font-family:inherit;border-bottom:2px solid transparent}
.tab-btn:hover{color:var(--i)}
.tab-btn.on{color:var(--i);background:rgba(99,102,241,.06);border-bottom-color:var(--i);font-weight:600}
.tab-pane{display:none;padding:16px 20px 20px}
.tab-pane.show{display:block}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-box{position:relative;height:370px}
.chart-box canvas{width:100%!important;height:100%!important}
.insight-box{margin-top:14px;padding:12px 16px;border-radius:10px;background:linear-gradient(90deg,rgba(99,102,241,.06),rgba(16,185,129,.04));border-left:3px solid var(--i);font-size:12.5px;color:var(--s600);line-height:1.7}
.insight-box strong{color:var(--s800)}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--s50);position:sticky;top:0;font-weight:600;color:var(--s600);text-align:left;padding:9px 12px;border-bottom:2px solid var(--s200);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--s100);color:var(--s700);white-space:nowrap}
tr:hover td{background:rgba(99,102,241,.03)}
.val-hi{color:var(--ro);font-weight:600}.val-lo{color:var(--em);font-weight:600}
.link-drill{color:var(--i);text-decoration:none;font-weight:500;cursor:pointer;font-size:12px}
.link-drill:hover{text-decoration:underline}
/* classification mapping */
.class-map{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.class-chip{padding:12px 10px;border-radius:10px;text-align:center;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(8px);cursor:pointer;transition:.2s}
.class-chip:hover,.class-chip.active{border-color:var(--i);background:rgba(99,102,241,.08);transform:translateY(-2px);box-shadow:0 4px 12px rgba(99,102,241,.15)}
.class-chip .cc-icon{font-size:22px;margin-bottom:4px}
.class-chip .cc-name{font-size:12px;font-weight:600;color:var(--s800)}
.class-chip .cc-sub{font-size:10.5px;color:var(--s400);margin-top:2px}
.class-chip .cc-val{font-size:14px;font-weight:700;color:var(--i);margin-top:4px}
/* pill selector */
.pill-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pill{font-size:11.5px;padding:4px 12px;border-radius:20px;border:1px solid var(--s200);background:#fff;cursor:pointer;color:var(--s600);font-weight:500;transition:.15s}
.pill:hover{border-color:var(--i);color:var(--i)}
.pill.on{background:var(--i);color:#fff;border-color:var(--i)}
/* bar group */
.qp-legend{display:flex;gap:16px;align-items:center;margin-bottom:8px;font-size:11.5px;color:var(--s500)}
.qp-legend span{display:flex;align-items:center;gap:4px}
.qp-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
@media(max-width:1200px){.kpi-strip{grid-template-columns:repeat(3,1fr)}.chart-row{grid-template-columns:1fr}.class-map{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.kpi-strip{grid-template-columns:repeat(2,1fr)}.class-map{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M3 9h18"/></svg>
    储能成本对标中心

  <nav class="nav-links">

    <a href="es-material-drilldown.html" class="active" id="lnk2">材料量价穿透</a>

</header>

<div class="filter-bar">

  <label>对标企业</label>

<div class="main">

<div class="kpi-strip" id="kpiStrip2"></div>

  <!-- Tab1: 材料对标排名 -->

    </div>
    <div class="insight-box" id="insightMt1"></div>

      <span><i style="background:#f59e0b"></i> 价差（单价偏差）</span>
      <span><i style="background:#94a3b8"></i> 交叉差异</span>
    </div>
    <div class="chart-row">
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--s700);margin-bottom:8px">量差 vs 价差分解（元/台）</div>
        <div class="chart-box"><canvas id="chartQP"></canvas></div>
      </div>
      <div>
        <div style="font-size:13px;font-weight:600;color:var(--s700);margin-bottom:8px">各企业量价差异占比</div>
        <div class="chart-box"><canvas id="chartQPpct"></canvas></div>
      </div>
    </div>
    <div class="insight-box" id="insightMt2"></div>
    <div class="tbl-wrap"><table id="tblQP"></table></div>
  </div>

  <!-- Tab3: 明细穿透 -->

    </div>
    <div class="tbl-wrap"><table id="tblDetail"></table></div>
  </div>
</div>
</div>

};

      <div class="cc-sub">${c.desc}</div>

let selectedCat='cell';
function selectClass(key){
  selectedCat=key;

  renderQPAnalysis();

/* KPI */
function renderKPI(){
  const totals=ENTERPRISES.map(e=>({name:e,total:catKeys.reduce((s,k)=>s+MAT_COST[e][k],0)})).sort((a,b)=>a.total-b.total);
  const avg=Math.round(totals.reduce((s,t)=>s+t.total,0)/totals.length);
  const best=totals[0],worst=totals[totals.length-1];
  const cellAvg=Math.round(ENTERPRISES.reduce((s,e)=>s+MAT_COST[e].cell,0)/ENTERPRISES.length);
  const cellPct=(cellAvg/avg*100).toFixed(1);

  const kpis=[
    {l:'最优材料成本',v:fmt(best.total),sub:best.name},
    {l:'最高材料成本',v:fmt(worst.total),sub:worst.name},
    {l:'材料成本均值',v:fmt(avg),sub:'全企业'},
    {l:'电芯成本占比',v:cellPct+'%',sub:'均值 '+fmt(cellAvg)},
    {l:'材料极差',v:fmt(worst.total-best.total),sub:((worst.total-best.total)/best.total*100).toFixed(1)+'%'}
  ];
  document.getElementById('kpiStrip2').innerHTML=kpis.map(k=>`
    <div class="kpi-card"><div class="kl">${k.l}</div><div class="kv">${k.v}</div><div class="kt">${k.sub}</div></div>`).join('');
}

}

/* Tab2: Quantity-Price Separation */
function renderQPAnalysis(){
  const cat=selectedCat;
  const qpSel=document.getElementById('qpCat');
  qpSel.innerHTML=CLASS_DEF.map(c=>`<option value="${c.key}" ${c.key===cat?'selected':''}>${c.name}</option>`).join('');
  const baseSel=document.getElementById('qpBase');
  baseSel.innerHTML=ENTERPRISES.map(e=>`<option>${e}</option>`).join('');

  const base=baseSel.value;
  const baseD=QP_DATA[cat].data[base];

  // 量差 = (实际量 - 基准量) × 基准价
  // 价差 = (实际价 - 基准价) × 基准量
  // 交叉 = (实际量 - 基准量) × (实际价 - 基准价)
  const analysis=ENTERPRISES.filter(e=>e!==base).map(e=>{
    const d=QP_DATA[cat].data[e];
    const qtyDiff=d.qty-baseD.qty;
    const priceDiff=d.price-baseD.price;
    const qtyVar=qtyDiff*baseD.price;
    const priceVar=priceDiff*baseD.qty;
    const crossVar=qtyDiff*priceDiff;
    const totalDiff=MAT_COST[e][cat]-MAT_COST[base][cat];
    return {name:e,qty:d.qty,price:d.price,qtyVar,priceVar,crossVar,totalDiff};
  });

  destroyChart('chartQP');
  chartInstances.chartQP=new Chart(document.getElementById('chartQP'),{
    type:'bar',
    data:{labels:analysis.map(a=>a.name),
      datasets:[
        {label:'量差',data:analysis.map(a=>a.qtyVar),backgroundColor:'#6366f1',borderRadius:4,barThickness:18},
        {label:'价差',data:analysis.map(a=>a.priceVar),backgroundColor:'#f59e0b',borderRadius:4,barThickness:18},
        {label:'交叉差',data:analysis.map(a=>a.crossVar),backgroundColor:'#94a3b8',borderRadius:4,barThickness:18}
      ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}},datalabels:{display:false}},
      scales:{x:{grid:{display:false}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{callback:v=>v>=0?'+'+fmt(v):fmt(v)}}}
    }
  });

  destroyChart('chartQPpct');
  const pctData=analysis.map(a=>{
    const absTotal=Math.abs(a.qtyVar)+Math.abs(a.priceVar)+Math.abs(a.crossVar)||1;
    return {qP:(Math.abs(a.qtyVar)/absTotal*100).toFixed(1),pP:(Math.abs(a.priceVar)/absTotal*100).toFixed(1),cP:(Math.abs(a.crossVar)/absTotal*100).toFixed(1)};
  });
  chartInstances.chartQPpct=new Chart(document.getElementById('chartQPpct'),{
    type:'bar',
    data:{labels:analysis.map(a=>a.name),
      datasets:[
        {label:'量差占比',data:pctData.map(d=>d.qP),backgroundColor:'#6366f1',borderRadius:2},
        {label:'价差占比',data:pctData.map(d=>d.pP),backgroundColor:'#f59e0b',borderRadius:2},
        {label:'交叉差占比',data:pctData.map(d=>d.cP),backgroundColor:'#94a3b8',borderRadius:2}
      ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}},datalabels:{display:false}},
      scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,max:100,ticks:{callback:v=>v+'%'},grid:{color:'rgba(0,0,0,.04)'}}}
    }
  });

  // insight
  const maxPriceVar=analysis.reduce((m,a)=>Math.abs(a.priceVar)>Math.abs(m.priceVar)?a:m,analysis[0]);
  const maxQtyVar=analysis.reduce((m,a)=>Math.abs(a.qtyVar)>Math.abs(m.qtyVar)?a:m,analysis[0]);
  document.getElementById('insightMt2').innerHTML=`<strong>💡 量价分离洞察（${CLASS_DEF.find(c=>c.key===cat).name}）：</strong>相对标杆 ${base}，价差最大的企业是 <strong>${maxPriceVar.name}</strong>（价差 ${maxPriceVar.priceVar>0?'+':''}${fmt(maxPriceVar.priceVar)}），量差最大的是 <strong>${maxQtyVar.name}</strong>（量差 ${maxQtyVar.qtyVar>0?'+':''}${fmt(maxQtyVar.qtyVar)}）。价差主导说明议价空间存在差异，量差主导则需审视BOM设计与工艺标准。`;

  // table
  let html='<thead><tr><th>企业</th><th>用量</th><th>单价</th><th>量差（元）</th><th>价差（元）</th><th>交叉差</th><th>总差异</th><th>主要动因</th></tr></thead><tbody>';
  analysis.forEach(a=>{
    const driver=Math.abs(a.priceVar)>Math.abs(a.qtyVar)?'价差主导':'量差主导';
    html+=`<tr><td style="font-weight:600">${a.name}</td><td>${a.qty}</td><td>${a.price.toLocaleString()}</td>
      <td class="${a.qtyVar>0?'val-hi':'val-lo'}">${a.qtyVar>0?'+':''}${a.qtyVar.toLocaleString()}</td>
      <td class="${a.priceVar>0?'val-hi':'val-lo'}">${a.priceVar>0?'+':''}${a.priceVar.toLocaleString()}</td>
      <td>${a.crossVar>0?'+':''}${a.crossVar.toLocaleString()}</td>
      <td style="font-weight:700" class="${a.totalDiff>0?'val-hi':'val-lo'}">${a.totalDiff>0?'+':''}${a.totalDiff.toLocaleString()}</td>
      <td><span style="padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:${Math.abs(a.priceVar)>Math.abs(a.qtyVar)?'rgba(245,158,11,.12);color:#b45309':'rgba(99,102,241,.12);color:#4f46e5'}">${driver}</span></td>
    </tr>`;
  });
  html+='</tbody>';
  document.getElementById('tblQP').innerHTML=html;
}
document.getElementById('qpCat').addEventListener('change',e=>{selectedCat=e.target.value;renderQPAnalysis()});
document.getElementById('qpBase').addEventListener('change',renderQPAnalysis);

/* Tab3: Detail drill */
function renderDetail(){
  const entSel=document.getElementById('detailEnt');
  entSel.innerHTML=ENTERPRISES.map(e=>`<option>${e}</option>`).join('');
  const catSel=document.getElementById('detailCat');
  catSel.innerHTML='<option value="all">全部分类</option>'+CLASS_DEF.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');

  function draw(){
    const ent=entSel.value;
    const cat=catSel.value;
    const kw=document.getElementById('detailSearch').value.toLowerCase();
    let rows=DETAIL_DATA[ent]||[];
    if(cat!=='all') rows=rows.filter(r=>r.cat===cat);
    if(kw) rows=rows.filter(r=>r.name.toLowerCase().includes(kw)||r.cat.toLowerCase().includes(kw));

    let html='<thead><tr><th>材料分类</th><th>材料名称</th><th>规格型号</th><th>单位</th><th>用量</th><th>单价（元）</th><th>金额（元）</th></tr></thead><tbody>';
    let total=0;
    rows.forEach(r=>{
      total+=r.amount;
      html+=`<tr><td>${r.cat}</td><td style="font-weight:600">${r.name}</td><td>${r.spec}</td><td>${r.unit}</td><td>${r.qty}</td><td>${r.price.toLocaleString()}</td><td style="font-weight:600">${r.amount.toLocaleString()}</td></tr>`;
    });
    html+=`<tr style="background:var(--s50);font-weight:700"><td colspan="6">合计</td><td>${total.toLocaleString()}</td></tr>`;
    html+='</tbody>';
    document.getElementById('tblDetail').innerHTML=html;
  }
  entSel.addEventListener('change',draw);
  catSel.addEventListener('change',draw);
  document.getElementById('detailSearch').addEventListener('input',draw);
  draw();
}

/* ── RENDER ALL ── */
function renderAll(){
  renderClassMap();renderKPI();renderCatPills();renderMatBar();renderMatPie();renderQPAnalysis();renderDetail();updateNavLinks();
}
renderAll();
